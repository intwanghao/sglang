[build-system]
requires = [
  "scikit-build-core>=0.10",
  "torch>=2.7.1",
  "wheel",
]
build-backend = "scikit_build_core.build"

[project]
name = "sgl-kernel-sycl"
version = "0.2.6.post1"
description = "SYCL Kernel Library for SGLang"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License"
]
dependencies = []

[tool.wheel]
exclude = [
  "dist*",
  "tests*",
]

[tool.scikit-build]
cmake.build-type = "Release"
minimum-version = "build-system.requires"

wheel.py-api = "cp39"
wheel.license-files = []
wheel.packages = ["python/sgl_kernel_sycl"]
